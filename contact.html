<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Love and Deepspace Shop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">

    <h1>Love and Deepspace Shop</h1>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

</header>

<main>

    <section class="contact-card">

        <h2>Contact Us</h2>

        <p>
            Have a question about our products? Send us a message
            and we will be happy to help.
        </p>

        <form action="#" method="post">

            <fieldset>

                <legend>Contact Details</legend>

                <label for="name">Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >

                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <label for="subject">Subject:</label>
                <select id="subject" name="subject" required>
                    <option value="">Choose a subject</option>
                    <option value="product-question">
                        Product Question
                    </option>
                    <option value="order-status">
                        Order Status
                    </option>
                    <option value="wholesale">
                        Wholesale Enquiry
                    </option>
                    <option value="other">
                        Something Else
                    </option>
                </select>

                <label for="message">Message:</label>
                <textarea
                    id="message"
                    name="message"
                    required
                ></textarea>

                <button type="submit" class="send-button">
                    Send message
                </button>

            </fieldset>

        </form>

    </section>

</main>

<footer>
    <p>&copy; 2026 Love and Deepspace Shop. All rights reserved.</p>
</footer>

</body>
</html>
